<div id="cards-demo">
<style>
#cards-demo, #cards-demo * { box-sizing: border-box; }
#cards-demo {
  --paper: #fff9f0; --ground: #eeece7; --ink: #263d3c; --muted: #555e58; --accent: #246d72;
  --timber: #2f6a4f; --timber-on: #ffffff; --timber-side: #173d35;
  --clay: #b8533d; --clay-on: #ffffff; --clay-side: #74372b;
  --wool: #b2ce80; --wool-on: #263d3c; --wool-side: #617744;
  --grain: #e3c462; --grain-on: #263d3c; --grain-side: #8c722d;
  --ore: #63748a; --ore-on: #ffffff; --ore-side: #414d5b;
  --loss: #8a2219; --shadow-control: 0 1px 0 rgb(24 51 45 / 0.12);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-numeral: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  display: block; width: 100%; max-width: 728px; margin: 0 auto; padding: 12px 10px 14px;
  background: #a9d9d6; color: #263d3c; color-scheme: light; border-radius: 12px;
  font-family: var(--font-ui); font-size: 15px; line-height: 1.3; text-align: left;
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
#cards-demo .cd-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(350px, 100%), 1fr)); gap: 18px 8px; margin: 0; padding: 0; }
#cards-demo .cd-rail { margin: 0; padding: 0; min-width: 0; }
#cards-demo .cd-label { margin: 0 0 8px; padding: 0; font: 700 13px/18px var(--font-ui); letter-spacing: 0.06em; text-transform: uppercase; color: #173d35; }
#cards-demo .cd-instruction {
  margin: 0; height: 32px; background: var(--paper); color: var(--ink); border-radius: 8px;
  padding: 6px 12px; font: 500 15px/20px var(--font-ui); white-space: nowrap; overflow: hidden;
}
#cards-demo .cd-instruction::before { content: ""; display: inline-block; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; margin-right: 8px; vertical-align: 2px; }
#cards-demo .cd-tray { display: flex; gap: 4px; padding: 12px 0 8px; max-width: 350px; margin: 0; }
#cards-demo .cd-slot { position: relative; flex: 1 1 0; min-width: 0; }
#cards-demo .cd-card { position: relative; height: 62px; border-radius: 8px; background: var(--paper); color: var(--ink); --fleece: var(--paper); }
#cards-demo .cd-sym svg { display: block; width: 100%; height: 100%; }
#cards-demo .cd-timber { --c: var(--timber); --deep: var(--timber-side); --on: var(--timber-on); --sym: var(--timber); }
#cards-demo .cd-clay   { --c: var(--clay);   --deep: var(--clay-side);   --on: var(--clay-on);   --sym: var(--clay); }
#cards-demo .cd-wool   { --c: var(--wool);   --deep: var(--wool-side);   --on: var(--wool-on);   --sym: var(--wool-side); }
#cards-demo .cd-grain  { --c: var(--grain);  --deep: var(--grain-side);  --on: var(--grain-on);  --sym: var(--grain-side); }
#cards-demo .cd-ore    { --c: var(--ore);    --deep: var(--ore-side);    --on: var(--ore-on);    --sym: var(--ore); }

/* ---------- timing: 2200 ms hold + 300 ms fade = 2500 ms ---------- */
#cards-demo { --cd-dur: 2500ms; }

/* ---------- V1 Column ---------- */
#cards-demo .cd-v1 { --rp: 42%; }
#cards-demo .cd-v1 .cd-card {
  display: flex; flex-direction: column; align-items: center; padding: 4px 0 0;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) var(--rp), var(--paper)), var(--shadow-control);
}
#cards-demo .cd-v1 .cd-sym { display: block; width: 18px; height: 18px; color: var(--sym); }
#cards-demo .cd-v1 .cd-count { display: block; margin-top: 1px; font: 700 24px/24px var(--font-numeral); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
#cards-demo .cd-v1 .cd-name { display: block; margin-top: 1px; font: 700 10px/12px var(--font-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
#cards-demo .cd-v1 .cd-card.cd-empty { background: var(--ground); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 22%, var(--ground)), var(--shadow-control); }
#cards-demo .cd-v1 .cd-card.cd-empty .cd-sym { color: color-mix(in srgb, var(--sym) 55%, var(--ground)); }
#cards-demo .cd-v1 .cd-card.cd-gain {
  background: var(--c); color: var(--on); --fleece: color-mix(in srgb, #fff 88%, var(--c));
  box-shadow: inset 0 0 0 1px var(--deep), 0 6px 12px rgb(24 51 45 / 0.22);
  transform: translateY(-6px); animation: cd-v1-gain var(--cd-dur) var(--ease-out) both;
}
#cards-demo .cd-v1 .cd-card.cd-gain .cd-sym { color: var(--on); }
#cards-demo .cd-v1 .cd-card.cd-gain .cd-name { color: var(--on); opacity: 0.9; }
#cards-demo .cd-v1 .cd-tab {
  position: absolute; left: 50%; top: -10px; transform: translateX(-50%);
  height: 14px; min-width: 28px; padding: 0 6px; border-radius: 5px 5px 0 0;
  font: 700 11.5px/14px var(--font-numeral); font-variant-numeric: tabular-nums; text-align: center; white-space: nowrap;
  animation: cd-tab var(--cd-dur) var(--ease-out) both;
}
#cards-demo .cd-v1 .cd-tab.cd-up { background: var(--deep); color: #fff; }
#cards-demo .cd-v1 .cd-card.cd-loss { transform: translateY(2px); animation: cd-v1-loss var(--cd-dur) var(--ease-out) both, cd-ring-v1 var(--cd-dur) var(--ease-out) both; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--loss) 55%, var(--paper)), var(--shadow-control); }
#cards-demo .cd-v1 .cd-tab.cd-down { background: var(--paper); color: var(--loss); box-shadow: inset 0 0 0 1px var(--loss); top: -11px; }

/* ---------- V2 Ledger ---------- */
#cards-demo .cd-v2 { --rp: 40%; }
#cards-demo .cd-v2 .cd-slot { z-index: 1; }
#cards-demo .cd-v2 .cd-card {
  display: grid; grid-template-columns: 1fr; grid-template-rows: 30px 14px; justify-items: center; align-content: start; padding: 8px 0 0;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) var(--rp), var(--paper)), var(--shadow-control);
}
#cards-demo .cd-v2 .cd-row { display: flex; align-items: center; gap: 5px; height: 30px; }
#cards-demo .cd-v2 .cd-sym { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: color-mix(in srgb, var(--c) 20%, var(--paper)); color: var(--sym); }
#cards-demo .cd-v2 .cd-sym svg { width: 17px; height: 17px; }
#cards-demo .cd-v2 .cd-count { display: block; min-width: 15px; text-align: center; font: 700 26px/30px var(--font-numeral); font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
#cards-demo .cd-v2 .cd-name { display: block; align-self: start; font: 600 11.5px/14px var(--font-ui); letter-spacing: 0.05em; font-variant-caps: all-small-caps; color: var(--muted); }
#cards-demo .cd-v2 .cd-card.cd-empty { background: var(--ground); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 20%, var(--ground)), var(--shadow-control); }
#cards-demo .cd-v2 .cd-card.cd-empty .cd-sym { background: color-mix(in srgb, var(--c) 10%, var(--ground)); color: color-mix(in srgb, var(--sym) 55%, var(--ground)); }
#cards-demo .cd-v2 .cd-card.cd-gain {
  background: var(--c); color: var(--on); --fleece: #fff;
  box-shadow: inset 0 0 0 1px var(--deep), 0 6px 12px rgb(24 51 45 / 0.22);
  animation: cd-v2-gain var(--cd-dur) var(--ease-out) both;
}
#cards-demo .cd-v2 .cd-slot.cd-gain { transform: translateY(-6px); animation: cd-lift var(--cd-dur) var(--ease-out) both; }
#cards-demo .cd-v2 .cd-slot.cd-loss { transform: translateY(2px); animation: cd-dip var(--cd-dur) var(--ease-out) both; }
#cards-demo .cd-v2 .cd-card.cd-gain .cd-sym { background: rgb(255 255 255 / 0.22); color: var(--on); }
#cards-demo .cd-v2 .cd-card.cd-gain .cd-name { color: var(--on); opacity: 0.9; }
#cards-demo .cd-v2 .cd-card.cd-gain.cd-wool .cd-sym, #cards-demo .cd-v2 .cd-card.cd-gain.cd-grain .cd-sym { background: rgb(255 249 240 / 0.55); }
#cards-demo .cd-v2 .cd-tab {
  position: absolute; left: 50%; top: -13px; transform: translateX(-50%); width: 44px; height: 30px; padding-top: 1px; border-radius: 7px;
  font: 700 12px/14px var(--font-numeral); font-variant-numeric: tabular-nums; text-align: center;
  animation: cd-v2-tab var(--cd-dur) var(--ease-out) both;
}
#cards-demo .cd-v2 .cd-tab.cd-up { background: var(--deep); color: #fff; box-shadow: 0 1px 0 rgb(24 51 45 / 0.12); }
#cards-demo .cd-v2 .cd-card.cd-loss { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--loss) 55%, var(--paper)), var(--shadow-control); animation: cd-ring-v2 var(--cd-dur) var(--ease-out) both; }
#cards-demo .cd-v2 .cd-tab.cd-down { background: var(--paper); color: var(--loss); box-shadow: inset 0 0 0 1px var(--loss), var(--shadow-control); top: -15px; }

/* ---------- keyframes (original shapes, stretched so the full fill holds 2200 ms then fades over 300 ms) ---------- */
@keyframes cd-v1-gain {
  0%   { background: var(--paper); color: var(--ink); transform: translateY(0); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 42%, var(--paper)), var(--shadow-control); }
  10.5%, 88% { background: var(--c); color: var(--on); transform: translateY(-6px); box-shadow: inset 0 0 0 1px var(--deep), 0 6px 12px rgb(24 51 45 / 0.22); }
  100% { background: var(--paper); color: var(--ink); transform: translateY(0); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 42%, var(--paper)), var(--shadow-control); }
}
@keyframes cd-v2-gain {
  0%   { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 40%, var(--paper)), var(--shadow-control); }
  10.5%, 88% { background: var(--c); color: var(--on); box-shadow: inset 0 0 0 1px var(--deep), 0 6px 12px rgb(24 51 45 / 0.22); }
  100% { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 40%, var(--paper)), var(--shadow-control); }
}
@keyframes cd-v1-loss { 0% { transform: translateY(0); } 12%, 88% { transform: translateY(2px); } 100% { transform: translateY(0); } }
@keyframes cd-dip  { 0% { transform: translateY(0); } 12%, 88% { transform: translateY(2px); } 100% { transform: translateY(0); } }
@keyframes cd-lift { 0% { transform: translateY(0); } 10.5%, 88% { transform: translateY(-6px); } 100% { transform: translateY(0); } }
@keyframes cd-ring-v1 {
  0%, 100% { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 42%, var(--paper)), var(--shadow-control); }
  12%, 88% { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--loss) 55%, var(--paper)), var(--shadow-control); }
}
@keyframes cd-ring-v2 {
  0%, 100% { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 40%, var(--paper)), var(--shadow-control); }
  12%, 88% { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--loss) 55%, var(--paper)), var(--shadow-control); }
}
@keyframes cd-tab { 0% { opacity: 0; } 9%, 90% { opacity: 1; } 100% { opacity: 0; } }
@keyframes cd-v2-tab {
  0% { opacity: 0; transform: translate(-50%, 10px); } 10.5%, 90% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, 0); }
}

/* ---------- reduced motion: no lift or dip; fill appears in place, same hold ---------- */
@keyframes cd-rm-gain {
  0% { background: var(--paper); color: var(--ink); } 2%, 88% { background: var(--c); color: var(--on); } 100% { background: var(--paper); color: var(--ink); }
}
@keyframes cd-rm-tab { 0% { opacity: 0; } 2%, 90% { opacity: 1; } 100% { opacity: 0; } }
#cards-demo.cd-rm .cd-card.cd-gain { transform: none; animation: cd-rm-gain var(--cd-dur) linear both; }
#cards-demo.cd-rm .cd-v2 .cd-card.cd-gain { animation: cd-rm-gain var(--cd-dur) linear both; }
#cards-demo.cd-rm .cd-v2 .cd-slot.cd-gain, #cards-demo.cd-rm .cd-v2 .cd-slot.cd-loss { transform: none; animation: none; }
#cards-demo.cd-rm .cd-v1 .cd-card.cd-loss { transform: none; animation: cd-ring-v1 var(--cd-dur) linear both; }
#cards-demo.cd-rm .cd-v2 .cd-card.cd-loss { animation: cd-ring-v2 var(--cd-dur) linear both; }
#cards-demo.cd-rm .cd-v1 .cd-tab { transform: translateX(-50%); animation: cd-rm-tab var(--cd-dur) linear both; }
#cards-demo.cd-rm .cd-v2 .cd-tab { transform: translateX(-50%); animation: cd-rm-tab var(--cd-dur) linear both; }

/* ---------- controls ---------- */
#cards-demo .cd-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 16px 0 0; padding: 0; }
#cards-demo .cd-btn {
  appearance: none; -webkit-appearance: none; margin: 0; min-height: 40px; padding: 8px 14px; border: 0; border-radius: 8px;
  background: #173d35; color: #fff9f0; font: 600 14px/20px var(--font-ui); cursor: pointer; text-transform: none; letter-spacing: 0; box-shadow: var(--shadow-control);
}
#cards-demo .cd-btn:hover { background: #246d72; }
#cards-demo .cd-btn:focus-visible, #cards-demo .cd-check input:focus-visible { outline: 3px solid #fff9f0; outline-offset: 2px; box-shadow: 0 0 0 5px #173d35; }
#cards-demo .cd-btn.cd-ghost { background: var(--paper); color: #173d35; }
#cards-demo .cd-btn.cd-ghost:hover { background: #fff; }
#cards-demo .cd-check { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 0 4px; padding: 0; min-height: 40px; font: 500 14px/20px var(--font-ui); color: #173d35; cursor: pointer; }
#cards-demo .cd-check input { margin: 0; width: 18px; height: 18px; accent-color: #173d35; }
#cards-demo .cd-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

<div class="cd-grid">
  <section class="cd-rail cd-v1" aria-label="V1 Column">
    <h3 class="cd-label">V1 · Column</h3>
    <p class="cd-instruction">Build, trade, or end your turn</p>
    <div class="cd-tray" data-cd-tray></div>
  </section>
  <section class="cd-rail cd-v2" aria-label="V2 Ledger">
    <h3 class="cd-label">V2 · Ledger</h3>
    <p class="cd-instruction">Build, trade, or end your turn</p>
    <div class="cd-tray" data-cd-tray></div>
  </section>
</div>

<div class="cd-controls">
  <button type="button" class="cd-btn" data-cd-play="gain">Play gain (Wood +2)</button>
  <button type="button" class="cd-btn" data-cd-play="loss">Play loss (Sheep −1)</button>
  <button type="button" class="cd-btn" data-cd-play="roll">Play roll (Wood +1, Wheat +2)</button>
  <button type="button" class="cd-btn" data-cd-play="all">Play all</button>
  <button type="button" class="cd-btn cd-ghost" data-cd-reset>Reset counts</button>
  <label class="cd-check"><input type="checkbox" data-cd-rm> Reduced motion</label>
</div>
<div class="cd-sr" role="status" aria-live="polite" data-cd-live></div>

<script>
(function () {
  var root = document.getElementById("cards-demo");
  if (!root) return;
  var FRAME = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"';
  var SYMBOLS = {
    timber: '<svg ' + FRAME + '><path d="m9 2-4 6h2l-4 6h3l-3 5h12l-3-5h3l-4-6h2L9 2Z" fill="currentColor" stroke="none"/><path d="M9 18v4m9-17-3 5h2l-3 5h8l-3-5h2l-3-5Z"/><path d="M18 15v5"/></svg>',
    clay: '<svg ' + FRAME + '><rect x="7" y="3" width="10" height="6" rx=".7" fill="currentColor" stroke="none"/><rect x="1" y="11" width="10" height="7" rx=".7" fill="currentColor" stroke="none"/><rect x="13" y="11" width="10" height="7" rx=".7" fill="currentColor" stroke="none"/></svg>',
    wool: '<svg ' + FRAME + '><path d="M8.6 17.6v3.6M14.4 17.6v3.6" stroke-width="2"/><path d="M6 17.6C3.1 17.6 2.3 13.9 4.5 12.7 3.4 10.4 5.9 8.2 8 9.3 8.6 6.5 12.5 6.2 13.5 8.6 15.9 7.4 18.8 9.5 17.9 12 20.3 13.2 19.6 16.9 16.9 17.6Z" fill="var(--fleece)" stroke-width="1.6"/><ellipse cx="18.9" cy="12.4" rx="3.3" ry="2.35" transform="rotate(-12 18.9 12.4)" fill="currentColor" stroke="none"/><path d="M16.1 10.8c-.4-1.3.3-2.2 1.6-2.2.4 1 0 2-1.6 2.2Z" fill="currentColor" stroke="none"/><circle cx="20.1" cy="11.8" r=".65" fill="var(--fleece)" stroke="none"/></svg>',
    grain: '<svg ' + FRAME + '><path d="M7 22 17 2"/><path d="M13 7c-3 0-5-3-4-5 3 0 5 3 4 5Zm2 3c0-3 3-5 6-5 0 3-3 5-6 5Zm-5 2c-3 0-5-3-4-5 3 0 5 3 4 5Zm2 3c0-3 3-5 6-5 0 3-3 5-6 5Zm-5 2c-3 0-5-3-4-5 3 0 5 3 4 5Zm2 3c0-3 3-5 6-5 0 3-3 5-6 5Z" fill="currentColor" stroke="none"/></svg>',
    ore: '<svg ' + FRAME + '><path d="m2 20 7-14 7 14H2Zm11 0-3-6 5-12 8 18H13Z" fill="currentColor" stroke="none"/></svg>'
  };
  var NAMES = { timber: "Wood", clay: "Brick", wool: "Sheep", grain: "Wheat", ore: "Stone" };
  var ORDER = ["timber", "clay", "wool", "grain", "ore"];
  var REST = { timber: 3, clay: 0, wool: 2, grain: 1, ore: 0 };
  var HOLD_MS = 2500; // 2200 ms full fill + 300 ms fade
  var counts = {};
  var cards = { v1: {}, v2: {} };
  var timers = [];
  var live = root.querySelector("[data-cd-live]");

  function build(rail, kind) {
    var tray = root.querySelector(".cd-" + kind + " [data-cd-tray]");
    ORDER.forEach(function (r) {
      var slot = document.createElement("div");
      slot.className = "cd-slot cd-" + r;
      var inner = '<span class="cd-sym" aria-hidden="true">' + SYMBOLS[r] + '</span><span class="cd-count"></span>';
      var name = '<span class="cd-name">' + NAMES[r] + '</span>';
      slot.innerHTML = '<div class="cd-card cd-' + r + '">' + (kind === "v2" ? '<span class="cd-row">' + inner + '</span>' : inner) + name + '</div>';
      tray.appendChild(slot);
      cards[kind][r] = { slot: slot, card: slot.firstChild, count: slot.querySelector(".cd-count"), tab: null };
    });
  }
  build(null, "v1"); build(null, "v2");

  function paintCount(r) {
    ["v1", "v2"].forEach(function (k) {
      var c = cards[k][r];
      c.count.textContent = counts[r];
      c.card.classList.toggle("cd-empty", counts[r] === 0);
    });
  }
  function reset() {
    timers.forEach(clearTimeout); timers = [];
    ORDER.forEach(function (r) { counts[r] = REST[r]; clearFx(r); paintCount(r); });
  }
  function clearFx(r) {
    ["v1", "v2"].forEach(function (k) {
      var c = cards[k][r];
      c.card.classList.remove("cd-gain", "cd-loss"); c.slot.classList.remove("cd-gain", "cd-loss");
      if (c.tab) { c.tab.remove(); c.tab = null; }
    });
  }
  function play(r, delta) {
    clearFx(r);
    void root.offsetWidth; // restart animations
    counts[r] = Math.max(0, counts[r] + delta);
    paintCount(r);
    var cls = delta > 0 ? "cd-gain" : "cd-loss";
    ["v1", "v2"].forEach(function (k) {
      var c = cards[k][r];
      var tab = document.createElement("span");
      tab.className = "cd-tab " + (delta > 0 ? "cd-up" : "cd-down");
      tab.textContent = delta > 0 ? "+" + delta : "−" + (-delta);
      tab.setAttribute("aria-hidden", "true");
      if (k === "v2") c.slot.insertBefore(tab, c.card); else c.card.appendChild(tab);
      c.tab = tab;
      c.card.classList.add(cls);
      if (k === "v2") c.slot.classList.add(cls);
    });
    if (live) live.textContent = NAMES[r] + " " + (delta > 0 ? "+" : "−") + Math.abs(delta) + ", now " + counts[r];
    timers.push(setTimeout(function () { clearFx(r); }, HOLD_MS + 60));
  }
  var PLAYS = {
    gain: [["timber", 2]],
    loss: [["wool", -1]],
    roll: [["timber", 1], ["grain", 2]]
  };
  function run(name) {
    if (name === "all") {
      var seq = PLAYS.gain.concat(PLAYS.loss, PLAYS.roll);
      // gain, then loss, then roll, each starting after the previous has faded
      var steps = [PLAYS.gain, PLAYS.loss, PLAYS.roll];
      steps.forEach(function (s, i) {
        timers.push(setTimeout(function () { s.forEach(function (p) { play(p[0], p[1]); }); }, i * (HOLD_MS + 150)));
      });
      return;
    }
    PLAYS[name].forEach(function (p) { play(p[0], p[1]); });
  }

  root.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button") : null;
    if (!b || !root.contains(b)) return;
    if (b.hasAttribute("data-cd-reset")) { reset(); return; }
    var name = b.getAttribute("data-cd-play");
    if (name) run(name);
  });
  var rm = root.querySelector("[data-cd-rm]");
  function applyRm() { root.classList.toggle("cd-rm", rm.checked); }
  rm.addEventListener("change", applyRm);
  try { if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) rm.checked = true; } catch (e) {}
  applyRm();
  reset();
})();
</script>
</div>
