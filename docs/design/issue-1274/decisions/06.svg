<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510"><rect width="1000" height="510" fill="#f3f6f5"/><g font-family="Arial, sans-serif"><text x="24" y="35" font-size="24" fill="#263d3c">06 · Landscape title — schematic alternatives</text><text x="24" y="61" font-size="14" fill="#263d3c">Proposed only · not a runtime screenshot · A is recommended</text><rect x="24" y="85" width="228" height="390" rx="12" fill="white" stroke="#78837a"/><text x="36" y="112" font-size="16" fill="#263d3c">A · recommended</text><text x="36" y="141" font-size="14" fill="#263d3c">Use a 360px right column</text><text x="36" y="161" font-size="14" fill="#263d3c">at 844×390; develop</text><text x="36" y="181" font-size="14" fill="#263d3c">overflow and keyboard</text><text x="36" y="201" font-size="14" fill="#263d3c">handling.</text><rect x="36" y="255" width="204" height="95" rx="0" fill="#e2ebe8" stroke="#78837a"/><rect x="153" y="255" width="87" height="95" rx="0" fill="white" stroke="#78837a"/><text x="40" y="303" font-size="14" fill="#263d3c">Island</text><text x="161" y="303" font-size="14" fill="#263d3c">Title</text><text x="36" y="376" font-size="12" fill="#263d3c">844×390 composition</text><rect x="268" y="85" width="228" height="390" rx="12" fill="white" stroke="#78837a"/><text x="280" y="112" font-size="16" fill="#263d3c">B</text><text x="280" y="141" font-size="14" fill="#263d3c">Keep the centred title</text><text x="280" y="161" font-size="14" fill="#263d3c">composition.</text><rect x="280" y="255" width="204" height="95" rx="0" fill="#e2ebe8" stroke="#78837a"/><rect x="328" y="267" width="110" height="72" rx="8" fill="white" stroke="#78837a"/><text x="362" y="308" font-size="14" fill="#263d3c">Title</text><text x="280" y="376" font-size="12" fill="#263d3c">844×390 composition</text><rect x="512" y="85" width="228" height="390" rx="12" fill="white" stroke="#78837a"/><text x="524" y="112" font-size="16" fill="#263d3c">C</text><text x="524" y="141" font-size="14" fill="#263d3c">Explore a wider column</text><text x="524" y="161" font-size="14" fill="#263d3c">with less island width.</text><rect x="524" y="255" width="204" height="95" rx="0" fill="#e2ebe8" stroke="#78837a"/><rect x="622" y="255" width="106" height="95" rx="0" fill="white" stroke="#78837a"/><text x="528" y="303" font-size="14" fill="#263d3c">Island</text><text x="628" y="303" font-size="14" fill="#263d3c">Title</text><text x="524" y="376" font-size="12" fill="#263d3c">844×390 composition</text><rect x="756" y="85" width="228" height="390" rx="12" fill="white" stroke="#78837a"/><text x="768" y="112" font-size="16" fill="#263d3c">D</text><text x="768" y="141" font-size="14" fill="#263d3c">Defer to the existing</text><text x="768" y="161" font-size="14" fill="#263d3c">title proposals before</text><text x="768" y="181" font-size="14" fill="#263d3c">choosing landscape.</text><rect x="768" y="255" width="204" height="95" rx="0" fill="#e2ebe8" stroke="#78837a"/><rect x="816" y="267" width="110" height="72" rx="8" fill="white" stroke="#78837a"/><text x="850" y="308" font-size="14" fill="#263d3c">Title</text><text x="768" y="376" font-size="12" fill="#263d3c">844×390 composition</text></g></svg>