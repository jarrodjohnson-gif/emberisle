name: CI

# The README "Run it" checks, on every pull request and every push to main.
# build, server and browser-a run on separate runners; browser-b has three suites (flows-a, flows-b, presentation) after build's dist/;
# flows is split in two so each half stays near 14 minutes (the whole was ~28).
# `checks` is the required merge check: it requires every job, including every browser-b suite.
# Docs-only PRs (see changes job) skip the heavy steps but still report success so required checks stay green.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE=$(git merge-base "origin/$BASE_REF" HEAD || true)
          if [ -z "$BASE" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LIST=$(git diff --no-renames --name-only "$BASE" HEAD)
          if [ -z "$LIST" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t CHANGED <<< "$LIST"
          DOCS_ONLY=true
          for file in "${CHANGED[@]}"; do
            # README.md is consumed by fortune-tray-prove; other markdown, docs, issue templates, and LICENSE are docs-only.
            case "$file" in
              README.md) DOCS_ONLY=false; break;;
              docs/*|.github/ISSUE_TEMPLATE/*|LICENSE|*.md)
                ;;
              *)
                DOCS_ONLY=false
                break
                ;;
            esac
          done
          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm ci
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm ci --prefix server
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run typecheck
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run build
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run size-prove

  server:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm ci
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm ci --prefix server
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run wayfarer-modes-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm test
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run touch-place-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run next-up-prove

  browser-a:
    needs: changes
    runs-on: ubuntu-latest
    # The browser jobs run about 19-20 minutes on a busy runner; 20 cancelled them mid-proof.
    timeout-minutes: 30
    steps:
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm ci
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm ci --prefix server
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: needs.changes.outputs.docs_only != 'true'
        run: npx playwright install --with-deps chromium
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run client-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run dpr-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run hotseat-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run tabs-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run countdown-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run trade-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run practice-trade-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run hud-safe-area-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run first-game-coach-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run render-recovery-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run rotate-overlays-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run fortune-count-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run fortune-tray-prove
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-prove-screenshot
          path: test-results/
          if-no-files-found: ignore

  browser-b:
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [flows-a, flows-b, presentation]
    steps:
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm ci
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm ci --prefix server
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: needs.changes.outputs.docs_only != 'true'
        run: npx playwright install --with-deps chromium
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-a'
        run: npm run hand-cards-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-a'
        run: npm run served-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-a'
        run: npm run chunk-fail-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-a'
        run: npm run restore-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-a'
        run: npm run night-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-a'
        run: npm run chat-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-a'
        run: npm run react-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-a'
        run: npm run wayfarer-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-a'
        run: npm run sounds-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-a'
        run: npm run tokens-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-a'
        run: npm run pieces-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-a'
        run: npm run pieces-land-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-a'
        run: npm run idle-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-a'
        run: npm run contrast-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-a'
        run: npm run keyboard-place-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-a'
        run: npm run upgrade-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-a'
        run: npm run flash-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-a'
        run: npm run reflow-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-a'
        run: npm run rotate-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-b'
        run: npm run pan-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-b'
        run: npm run board-touch-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-b'
        run: npm run hole-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-b'
        run: npm run banner-stable-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-b'
        run: npm run howto-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-b'
        run: npm run title-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-b'
        run: npm run wayfarer-setup-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-b'
        run: npm run victory-target-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-b'
        run: npm run watch-ui-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-b'
        run: npm run tabs-prove-4
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'presentation'
        run: npm run visual-direction-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'presentation'
        run: npm run jelly-ocean-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'presentation'
        run: npm run waves-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'presentation'
        run: npm run splash-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'presentation'
        run: npm run polish-tokens-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'presentation'
        run: npm run roll-moment-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'presentation'
        run: npm run goods-log-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'presentation'
        run: npm run turn-gain-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'presentation'
        run: npm run win-action-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'presentation'
        run: npm run turn-copy-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'presentation'
        run: npm run table-menu-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'presentation'
        run: npm run build-ready-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'presentation'
        run: npm run board-look-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'presentation'
        run: npm run seat-rail-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'presentation'
        run: npm run public-score-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'presentation'
        run: npm run hand-hidden-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'presentation'
        run: npm run install-prove
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-b-${{ matrix.suite }}-test-results
          path: test-results/
          if-no-files-found: ignore

  # always() so a failed or cancelled job above fails this check instead of skipping it (a skipped required check passes).
  checks:
    needs: [changes, build, server, browser-a, browser-b]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo 'build=${{ needs.build.result }} server=${{ needs.server.result }} browser-a=${{ needs.browser-a.result }} browser-b=${{ needs.browser-b.result }}'
          test '${{ needs.build.result }}' = success
          test '${{ needs.server.result }}' = success
          test '${{ needs.browser-a.result }}' = success
          test '${{ needs.browser-b.result }}' = success
