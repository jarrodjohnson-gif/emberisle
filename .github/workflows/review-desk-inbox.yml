name: review-desk-inbox

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  # Hub (#854) posts and "Question:" comments reach the desk too, not only new PRs.
  issue_comment:
    types: [created]

permissions:
  pull-requests: write

jobs:
  notify:
    # Never comment about the inbox PR itself.
    if: github.event_name == 'pull_request_target' && github.event.pull_request.number != 699
    runs-on: ubuntu-latest
    steps:
      # No checkout: fork code never runs. PR fields stay in env data.
      - name: Comment on the inbox PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          INBOX: "699"
          NUM: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTION: ${{ github.event.action }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          gh pr comment "$INBOX" --repo "$REPO" --body "review-desk: PR #$NUM $ACTION by $AUTHOR (draft=$DRAFT)"

  relay:
    # Every comment on the hub, and any comment that opens with "Question:". The inbox's own comments are skipped.
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.number != 699 &&
      (github.event.issue.number == 854 || startsWith(github.event.comment.body, 'Question:'))
    runs-on: ubuntu-latest
    steps:
      # No checkout. Only the number, author and link are posted, never the comment text.
      - name: Comment on the inbox PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          INBOX: "699"
          NUM: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.comment.user.login }}
          URL: ${{ github.event.comment.html_url }}
        run: |
          gh pr comment "$INBOX" --repo "$REPO" --body "review-desk: comment on #$NUM by $AUTHOR: $URL"
