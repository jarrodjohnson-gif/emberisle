<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510"><rect width="1000" height="510" fill="#f3f6f5"/><g font-family="Arial, sans-serif"><text x="24" y="35" font-size="24" fill="#263d3c">02 · Corner radii — schematic alternatives</text><text x="24" y="61" font-size="14" fill="#263d3c">Proposed only · not a runtime screenshot · A is recommended</text><rect x="24" y="85" width="228" height="390" rx="12" fill="white" stroke="#78837a"/><text x="36" y="112" font-size="16" fill="#263d3c">A · recommended</text><text x="36" y="141" font-size="14" fill="#263d3c">Choose 8/12/20px,</text><text x="36" y="161" font-size="14" fill="#263d3c">matching current tokens.</text><rect x="38" y="255" width="58" height="64" rx="8" fill="white" stroke="#78837a"/><text x="54" y="294" font-size="14" fill="#263d3c">8</text><rect x="105" y="255" width="58" height="64" rx="12" fill="white" stroke="#78837a"/><text x="121" y="294" font-size="14" fill="#263d3c">12</text><rect x="172" y="255" width="58" height="64" rx="20" fill="white" stroke="#78837a"/><text x="188" y="294" font-size="14" fill="#263d3c">20</text><rect x="268" y="85" width="228" height="390" rx="12" fill="white" stroke="#78837a"/><text x="280" y="112" font-size="16" fill="#263d3c">B</text><text x="280" y="141" font-size="14" fill="#263d3c">Restore the recorded</text><text x="280" y="161" font-size="14" fill="#263d3c">12/16/24px scale.</text><rect x="282" y="255" width="58" height="64" rx="12" fill="white" stroke="#78837a"/><text x="298" y="294" font-size="14" fill="#263d3c">12</text><rect x="349" y="255" width="58" height="64" rx="16" fill="white" stroke="#78837a"/><text x="365" y="294" font-size="14" fill="#263d3c">16</text><rect x="416" y="255" width="58" height="64" rx="24" fill="white" stroke="#78837a"/><text x="432" y="294" font-size="14" fill="#263d3c">24</text><rect x="512" y="85" width="228" height="390" rx="12" fill="white" stroke="#78837a"/><text x="524" y="112" font-size="16" fill="#263d3c">C</text><text x="524" y="141" font-size="14" fill="#263d3c">Keep existing per-</text><text x="524" y="161" font-size="14" fill="#263d3c">component shapes until a</text><text x="524" y="181" font-size="14" fill="#263d3c">separate audit.</text><rect x="526" y="255" width="58" height="64" rx="8" fill="white" stroke="#78837a"/><text x="542" y="294" font-size="14" fill="#263d3c">8</text><rect x="593" y="255" width="58" height="64" rx="16" fill="white" stroke="#78837a"/><text x="609" y="294" font-size="14" fill="#263d3c">16</text><rect x="660" y="255" width="58" height="64" rx="24" fill="white" stroke="#78837a"/><text x="676" y="294" font-size="14" fill="#263d3c">24</text><rect x="756" y="85" width="228" height="390" rx="12" fill="white" stroke="#78837a"/><text x="768" y="112" font-size="16" fill="#263d3c">D</text><text x="768" y="141" font-size="14" fill="#263d3c">Request another shape</text><text x="768" y="161" font-size="14" fill="#263d3c">comparison before</text><text x="768" y="181" font-size="14" fill="#263d3c">choosing.</text><rect x="770" y="255" width="58" height="64" rx="4" fill="white" stroke="#78837a"/><text x="786" y="294" font-size="14" fill="#263d3c">4</text><rect x="837" y="255" width="58" height="64" rx="8" fill="white" stroke="#78837a"/><text x="853" y="294" font-size="14" fill="#263d3c">8</text><rect x="904" y="255" width="58" height="64" rx="16" fill="white" stroke="#78837a"/><text x="920" y="294" font-size="14" fill="#263d3c">16</text></g></svg>