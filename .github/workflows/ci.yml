name: CI

# The README "Run it" checks, on every pull request and every push to main.
# build, server and browser-a run on separate runners; browser-b has two suites after build's dist/.
# `checks` is the required merge check: it requires every job, including both browser-b suites.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
      - run: npm run size-prove

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm test
      - run: npm run touch-place-prove

  browser-a:
    runs-on: ubuntu-latest
    # The browser jobs run about 19-20 minutes on a busy runner; 20 cancelled them mid-proof.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run client-prove
      - run: npm run dpr-prove
      - run: npm run hotseat-prove
      - run: npm run tabs-prove
      - run: npm run countdown-prove
      - run: npm run trade-prove
      - run: npm run practice-trade-prove
      - run: npm run hud-safe-area-prove
      - run: npm run rotate-overlays-prove
      - run: npm run fortune-count-prove
      - run: npm run fortune-tray-prove
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-prove-screenshot
          path: test-results/
          if-no-files-found: ignore

  browser-b:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [flows, presentation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - if: matrix.suite == 'flows'
        run: npm run hand-cards-prove
      - if: matrix.suite == 'flows'
        run: npm run served-prove
      - if: matrix.suite == 'flows'
        run: npm run chunk-fail-prove
      - if: matrix.suite == 'flows'
        run: npm run restore-prove
      - if: matrix.suite == 'flows'
        run: npm run night-prove
      - if: matrix.suite == 'flows'
        run: npm run chat-prove
      - if: matrix.suite == 'flows'
        run: npm run react-prove
      - if: matrix.suite == 'flows'
        run: npm run wayfarer-prove
      - if: matrix.suite == 'flows'
        run: npm run sounds-prove
      - if: matrix.suite == 'flows'
        run: npm run tokens-prove
      - if: matrix.suite == 'flows'
        run: npm run pieces-prove
      - if: matrix.suite == 'flows'
        run: npm run pieces-land-prove
      - if: matrix.suite == 'flows'
        run: npm run idle-prove
      - if: matrix.suite == 'flows'
        run: npm run contrast-prove
      - if: matrix.suite == 'flows'
        run: npm run keyboard-place-prove
      - if: matrix.suite == 'flows'
        run: npm run flash-prove
      - if: matrix.suite == 'flows'
        run: npm run reflow-prove
      - if: matrix.suite == 'flows'
        run: npm run rotate-prove
      - if: matrix.suite == 'flows'
        run: npm run banner-stable-prove
      - if: matrix.suite == 'flows'
        run: npm run howto-prove
      - if: matrix.suite == 'flows'
        run: npm run title-prove
      - if: matrix.suite == 'flows'
        run: npm run victory-target-prove
      - if: matrix.suite == 'flows'
        run: npm run watch-ui-prove
      - if: matrix.suite == 'flows'
        run: npm run tabs-prove-4
      - if: matrix.suite == 'presentation'
        run: npm run visual-direction-prove
      - if: matrix.suite == 'presentation'
        run: npm run jelly-ocean-prove
      - if: matrix.suite == 'presentation'
        run: npm run waves-prove
      - if: matrix.suite == 'presentation'
        run: npm run splash-prove
      - if: matrix.suite == 'presentation'
        run: npm run polish-tokens-prove
      - if: matrix.suite == 'presentation'
        run: npm run roll-moment-prove
      - if: matrix.suite == 'presentation'
        run: npm run goods-log-prove
      - if: matrix.suite == 'presentation'
        run: npm run turn-gain-prove
      - if: matrix.suite == 'presentation'
        run: npm run win-action-prove
      - if: matrix.suite == 'presentation'
        run: npm run turn-copy-prove
      - if: matrix.suite == 'presentation'
        run: npm run table-menu-prove
      - if: matrix.suite == 'presentation'
        run: npm run build-ready-prove
      - if: matrix.suite == 'presentation'
        run: npm run board-look-prove
      - if: matrix.suite == 'presentation'
        run: npm run seat-rail-prove
      - if: matrix.suite == 'presentation'
        run: npm run public-score-prove
      - if: matrix.suite == 'presentation'
        run: npm run hand-hidden-prove
      - if: matrix.suite == 'presentation'
        run: npm run install-prove
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-b-${{ matrix.suite }}-test-results
          path: test-results/
          if-no-files-found: ignore

  # always() so a failed or cancelled job above fails this check instead of skipping it (a skipped required check passes).
  checks:
    needs: [build, server, browser-a, browser-b]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo 'build=${{ needs.build.result }} server=${{ needs.server.result }} browser-a=${{ needs.browser-a.result }} browser-b=${{ needs.browser-b.result }}'
          test '${{ needs.build.result }}' = success
          test '${{ needs.server.result }}' = success
          test '${{ needs.browser-a.result }}' = success
          test '${{ needs.browser-b.result }}' = success
