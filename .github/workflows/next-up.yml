name: Next up

on:
  schedule:
    - cron: '*/15 * * * *'
  issues:
    types: [labeled, unlabeled]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read
  contents: read

concurrency:
  group: next-up
  cancel-in-progress: false

jobs:
  update:
    # Avoid responding to our own generated body update. Run trusted default-branch code only.
    if: >-
      github.event_name != 'issue_comment' ||
      contains(github.event.comment.body, '/claim') ||
      contains(github.event.comment.body, '/paused')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/next-up.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
