# Trusted default-branch script only: no PR checkout, artifacts, installs, or AI calls.
name: desk-board
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [ready_for_review]
  schedule:
    - cron: '17 0,8,16 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  checks: read
  issues: write
concurrency:
  group: desk-board
  cancel-in-progress: true
jobs:
  board:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.path == '.github/workflows/ci.yml'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/desk-board.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/desk-board.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
