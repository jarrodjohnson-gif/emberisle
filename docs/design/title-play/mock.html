<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Emberisle · title design proposal</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif;color:#293c3c;background:#b2dddf url('assets/island-1280x720.jpg') center/cover no-repeat;font-size:15px;line-height:22px}button,input,select{font:inherit;color:inherit}button{cursor:pointer;min-width:44px;height:44px;border:1px solid #7f908e;border-radius:12px;background:#fff;padding:0 12px;font-weight:600;white-space:nowrap}button:hover{background:#e8eeec}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #1b726e;outline-offset:2px}button:disabled{background:#edf1ef;border-color:#c6d0cd;color:#667873;cursor:default}input{min-width:0;width:100%;height:44px;padding:0 12px;border:1px solid #7f908e;border-radius:12px;background:white;font-size:16px}h1,h2,h3,p{margin:0}h1{font:600 48px/56px Georgia,serif;letter-spacing:-1.5px}h2{font-size:24px;line-height:32px;letter-spacing:-.5px}h3{font-size:20px;line-height:26px;letter-spacing:-.3px}.muted,small{color:#536763;font-size:12px;line-height:16px}.primary{background:#285550;border-color:#285550;color:#fff}.primary:hover{background:#1f4945}.quiet{border-color:transparent;background:transparent}.card{position:absolute;left:40px;bottom:40px;border-radius:24px;background:#f4f7f6;box-shadow:0 8px 32px #233e4320;border:1px solid #d1dbd9;padding:20px}.front{width:384px;display:grid;gap:16px}.front .primary{height:48px;width:100%;font-size:16px}.tools{display:flex;gap:8px;align-items:center}.tools button{font-size:12px;flex:1;padding:0 8px}.tools button:first-child{flex:1.3}.front .tools{justify-content:center}.front .tools button{flex:0 1 auto}.play{width:720px;display:grid;grid-template-columns:280px 1fr;gap:20px;padding:20px}.nav{display:grid;gap:16px;align-content:start}.head{display:flex;align-items:center;gap:8px;height:44px}.head .back{padding:0;width:44px;flex-shrink:0;font-size:24px}.head h2{flex:1}.identity{display:grid;gap:4px}.identity-fields{display:grid;grid-template-columns:44px 1fr;gap:8px}.color{display:grid;place-items:center;padding:0}.dot{width:20px;height:20px;background:#e23d2e;clip-path:polygon(50% 5%,100% 95%,0 95%)}.modes{display:grid;grid-template-columns:1fr;gap:8px}.mode{height:64px;white-space:normal;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px;font-size:15px;line-height:20px;padding:0 12px}.mode small{font-weight:400}.mode[aria-current=true]{border:2px solid #285550;background:#e6eeeb;padding-left:11px}.mode.primary small{color:#fff}.detail{background:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;align-self:stretch}.detail-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}.detail-head h3{flex:1}.count{font-size:12px;line-height:16px;color:#536763}.tables{display:grid;gap:8px}.table{display:flex;align-items:center;gap:8px;min-height:64px;padding:8px;background:#f4f7f6;border-radius:12px}.table-text{min-width:0;flex:1}.table-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:600;line-height:20px}.table button{padding:0 12px;font-size:14px}.full{font-size:12px;width:56px;text-align:center}.pager{display:flex;align-items:center;justify-content:space-between;gap:8px}.pager p{font-size:12px}.pager-buttons{display:flex;gap:8px}.empty{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:12px;padding:12px 0}.empty h3{font-size:18px}.empty p{font-size:14px;line-height:20px;color:#536763}.empty button{align-self:center}.detail-footer{margin-top:auto;display:grid;gap:8px}.detail-footer button{font-size:14px}.private-form{display:grid;gap:12px}.private-form label{display:grid;gap:4px;font-size:12px;line-height:16px;color:#536763}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.visibility{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}.visibility button{font-size:12px}.error{font-size:12px;line-height:16px;color:#9d3529;min-height:32px}.rule{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}.rule select{height:44px;min-width:80px;border-radius:12px;background:#fff;padding:0 8px;border:1px solid #7f908e}.overlay{position:fixed;inset:0;background:#ffffff73;display:grid;place-items:center;padding:16px}.sheet{border-radius:24px;background:#f4f7f6;border:1px solid #d1dbd9;width:min(400px,100%);padding:16px;display:grid;gap:12px}.colors{display:flex;gap:8px}.colors button{width:64px;height:64px;font-size:12px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.colors i{width:20px;height:20px;border:1px solid #687a77;border-radius:50%}.sheet header{display:flex;align-items:center;justify-content:space-between;gap:8px}.sheet h3{font-size:20px}.note{font-size:14px;line-height:20px;color:#536763}.hidden{display:none!important}
@media(max-width:767px) and (orientation:portrait){body{background-image:url('assets/island-390x844.jpg')}.card{left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));width:calc(100% - 32px);padding:16px}.front{gap:16px}.front h1{font-size:40px;line-height:48px}.play{grid-template-columns:1fr;gap:12px}.nav{gap:12px}.head h2{font-size:24px}.modes{grid-template-columns:1fr 1fr}.mode{font-size:14px;padding:0 8px}.mode[aria-current=true]{padding-left:7px}.mode small{font-size:12px;line-height:16px}.nav>.tools{grid-row:5}.play>.detail{padding:12px;gap:8px}.table{min-height:56px;padding:6px 8px}.detail-head{min-height:32px}.detail-footer{grid-template-columns:1fr;gap:4px}.empty{min-height:176px;padding:8px 0}.front .tools{grid-row:auto}.play .nav>.tools{display:none}.play>.mobile-tools{display:flex;grid-column:1}.private-form{gap:8px}.private-form .error{min-height:16px}}
@media(min-width:768px){.mobile-tools{display:none}}
@media(max-height:500px) and (orientation:landscape){body{background-image:url('assets/island-844x390.jpg')}.card{left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));padding:12px}.front{width:320px;gap:12px}.front h1{font-size:40px;line-height:48px}.play{width:616px;grid-template-columns:280px 1fr;gap:12px;height:366px}.nav{gap:8px}.head h2{font-size:20px;line-height:26px}.identity{gap:4px}.modes{grid-template-columns:1fr 1fr}.mode{height:64px;font-size:14px;line-height:18px;padding:0 8px}.mode[aria-current=true]{padding-left:7px}.tools button{padding:0 4px}.detail{padding:12px;gap:8px}.detail-head{min-height:28px}.detail-head h3{font-size:18px;line-height:24px}.table{min-height:56px;padding:6px 8px}.table button{padding:0 8px}.table-name{font-size:13px}.detail-footer{gap:0}.detail-footer p{display:none}.private-form{gap:8px}.private-form .error{min-height:32px}.visibility{gap:4px}.visibility button{padding:0 8px}.empty{padding:0}.empty h3{font-size:17px}.empty p{font-size:13px}}
</style></head><body>
<main id="app"></main><div id="modal"></div>
<script>
// Review prototype only. Never calls the game store, host, audio or network.
const params=new URLSearchParams(location.search);let screen=params.get('screen')||'front',count=Number(params.get('tables')??6),page=Number(params.get('page')||1),code=params.get('code')||'',name='Ember',openMode=params.get('open')==='1',muted=false;let state=params.get('state')||'ready';
const rows=[['Jarrod’s table','2/4 seated','Join'],['Tide’s table','3/4 seated','Join'],['Pine’s table','1/4 seated','Join'],['Dune’s table','4/4 · full','Full'],['Friday island','4/4 · in game','Watch'],['Weekend crew','3/4 · game over','Watch']];
const tools=()=>`<button class="quiet" onclick="showSheet('rules')">Wayfarer rules</button><button class="quiet" onclick="showSheet('help')">How to play</button><button class="quiet" aria-label="Sound" aria-pressed="${!muted}" onclick="toggleSound()">Sound ${muted?'off':'on'}</button>`;
function toggleSound(){muted=!muted;render();[...document.querySelectorAll('[aria-label="Sound"]')].find(e=>e.getClientRects().length)?.focus()}
function go(s){const from=screen;screen=s;render();if(from==='private'&&s==='play')document.querySelector('.modes button:last-child')?.focus();else document.querySelector('h2, h1')?.focus()}
function back(){if(screen==='front')return;go('front');document.querySelector('#play')?.focus()}
function render(){const app=document.getElementById('app');if(screen==='front'){app.innerHTML=`<section class="card front" aria-label="Emberisle"><h1 tabindex="-1">Emberisle</h1><button id="play" class="primary" onclick="go('play')">Play</button><div class="tools"><button class="quiet" onclick="showSheet('help')">How to play</button><button class="quiet" aria-label="Sound" aria-pressed="${!muted}" onclick="toggleSound()">Sound ${muted?'off':'on'}</button></div></section>`;return}app.innerHTML=`<section class="card play" aria-label="Play"><div class="nav"><header class="head"><button class="quiet back" aria-label="${screen==='private'?'Back to Play':'Back to title'}" onclick="${screen==='private'?"go('play')":"back()"}">‹</button><h2 tabindex="-1">Play</h2></header><label class="identity"><span class="muted">Your name</span><span class="identity-fields"><button class="color" aria-label="Your color: Ember" onclick="showSheet('color')"><i class="dot"></i></button><input aria-label="Your name" value="${name}" onchange="name=Array.from(this.value).slice(0,16).join('')||'Ember';this.value=name"></span></label><nav class="modes" aria-label="Game choices"><button class="mode ${screen==='play'?'primary':''}" onclick="showSheet('bots')">Play against bots<small>Just you and three bots.</small></button><button class="mode" onclick="showSheet('pass')">Pass this device<small>Four people, one screen.</small></button><button class="mode" aria-current="${screen==='play'}" onclick="page=1;go('play')">Open tables<small>Join a listed table.</small></button><button class="mode" aria-current="${screen==='private'}" onclick="go('private')">Online private<small>Host, join or watch.</small></button></nav><div class="tools">${tools()}</div></div><section class="detail" aria-label="${screen==='private'?'Online private':'Open tables'}">${screen==='private'?privateDetail():tablesDetail()}</section><div class="tools mobile-tools">${tools()}</div></section>`;if(params.get('sheet')&&!document.getElementById('modal').children.length)showSheet(params.get('sheet'));}
function tablesDetail(){let body='';if(state==='loading'||state==='offline'||state==='failed'){body=`<div class="empty"><h3>${state==='loading'?'Finding tables…':'Tables unavailable'}</h3><p>${state==='loading'?'You can play against bots while we look.':'You can still play against bots or pass this device.'}</p>${state==='loading'?'':`<button onclick="state='ready';render()">Try again</button>`}</div>`}else if(!count){body=`<div class="empty"><h3>No open tables yet</h3><p>Start one and let people join.</p><button onclick="openMode=true;go('private')">Host an open table</button></div>`}else body=`<div class="tables">${rows.slice((page-1)*3,page*3).map(([n,s,a])=>`<div class="table"><div class="table-text"><p class="table-name" title="${n}">${n}</p><p class="muted">${s}</p></div>${a==='Full'?'<span class="full">Full</span>':`<button aria-label="${a} ${n}" onclick="showSheet('${a.toLowerCase()}')">${a}</button>`}</div>`).join('')}</div><div class="pager"><p aria-live="polite">${(page-1)*3+1}–${Math.min(page*3,count)} of ${count}</p><div class="pager-buttons"><button aria-label="Previous tables" ${page===1?'disabled':''} onclick="page--;render()">‹</button><button aria-label="Next tables" ${page*3>=count?'disabled':''} onclick="page++;render()">›</button></div></div>`;return `<header class="detail-head"><h3>Open tables</h3><span class="count">${state==='ready'?count+' listed':''}</span></header>${body}${count&&state==='ready'?`<footer class="detail-footer"><button class="quiet" onclick="openMode=true;go('private')">Host an open table</button><p class="muted">Visible to anyone on this host.</p></footer>`:''}`}
function editCode(value){code=value.toUpperCase();render();const field=document.querySelector('.private-form input');field.focus();field.setSelectionRange(code.length,code.length)}
function privateDetail(){const valid=code.length===4,watch=state==='watch';return `<header class="detail-head"><h3>${openMode?'Host an open table':'Online private'}</h3></header><div class="private-form"><button class="${!valid?'primary':''}" onclick="showSheet('host')">Host a table</button><div class="visibility"><span>${openMode?'Listed for anyone to join':'Only people with the code'}</span><button aria-pressed="${openMode}" onclick="openMode=!openMode;render()">${openMode?'Open':'Private'}</button></div><label>Code<input aria-label="Join code" placeholder="4-letter code" value="${code}" maxlength="4" autocapitalize="characters" autocomplete="off" oninput="editCode(this.value)"></label><div class="pair"><button ${valid?'':'disabled'} class="${valid&&!watch?'primary':''}" onclick="showSheet('join')">Join</button><button ${valid?'':'disabled'} class="${valid&&watch?'primary':''}" onclick="showSheet('watch')">Watch</button></div><p class="error" role="status">${state==='error'?'That table could not be joined. Check the code and try again.':state==='busy'?'Joining table…':watch?'':' '}</p></div>`}
let opener;
function showSheet(kind){opener=document.activeElement;document.getElementById('app').inert=true;let heading='',body='';if(kind==='rules'){heading='Wayfarer rules';body=['Play against bots','Host a table online','Pass this device'].map(x=>`<label class="rule">${x}<select aria-label="${x}"><option>On</option><option>Off</option></select></label>`).join('')}else if(kind==='color'){heading='Your color';body=`<div class="colors">${[['Ember','#e23d2e'],['Tide','#2d6ee8'],['Dune','#f3ecd9'],['Pine','#8a4fd3']].map(([n,c])=>`<button aria-label="${n}" onclick="closeSheet()"><i style="background:${c}"></i>${n}</button>`).join('')}</div>`}else if(kind==='help'){heading='How to play';body='<p class="note">The existing How to play sheet opens here. Its content and paging stay unchanged.</p>'}else{heading=({bots:'Play against bots',pass:'Pass this device',host:'Host a table',join:'Join table',watch:'Watch table'})[kind]||kind;body='<p class="note">End of design prototype. The implementation calls the existing action here; this mock never creates or joins a game.</p>'}document.getElementById('modal').innerHTML=`<div class="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="${heading}"><header><h3>${heading}</h3><button onclick="closeSheet()">Close</button></header>${body}</section></div>`;document.querySelector('.sheet button')?.focus()}
function closeSheet(){document.getElementById('modal').innerHTML='';document.getElementById('app').inert=false;opener?.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.querySelector('.sheet'))closeSheet();else if(screen==='private')go('play');else back()}if(e.key==='Tab'&&document.querySelector('.sheet')){const a=[...document.querySelectorAll('.sheet button,.sheet select')],first=a[0],last=a.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});render();
</script></body></html>
