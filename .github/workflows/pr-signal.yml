# Keeps one signal label (green, yellow or red) on every open, ready PR. Rules: scripts/pr-signal.mjs and docs/DESK.md.
# Trusted default-branch scripts only: no PR checkout, artifacts, installs, or AI calls.
name: pr-signal
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]
  # A review comment can turn a PR green or back to yellow.
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  checks: read
  issues: write
concurrency:
  group: pr-signal
  cancel-in-progress: true
jobs:
  signal:
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.path == '.github/workflows/ci.yml') &&
      (github.event_name != 'issue_comment' ||
        (github.event.issue.pull_request && contains(github.event.comment.body, '<!-- review-desk')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/pr-signal.mjs
            scripts/desk-board.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/pr-signal.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
