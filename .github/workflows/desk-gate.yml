# Accident guard only, not protection against spoofing: every agent posts as one login.
# The owner adds this status to the ruleset after it has run green on several PRs.
name: desk-gate
on:
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target:
    types: [synchronize, ready_for_review, converted_to_draft, reopened]
permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write
concurrency:
  group: desk-gate-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  gate:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      # Always use trusted base code, never code from the pull request.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: node scripts/desk-gate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
