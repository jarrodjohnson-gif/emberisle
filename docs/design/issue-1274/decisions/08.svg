<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510"><rect width="1000" height="510" fill="#f3f6f5"/><g font-family="Arial, sans-serif"><text x="24" y="35" font-size="24" fill="#263d3c">08 · Fortune tray — schematic alternatives</text><text x="24" y="61" font-size="14" fill="#263d3c">Proposed only · not a runtime screenshot · A is recommended</text><rect x="24" y="85" width="228" height="390" rx="12" fill="white" stroke="#78837a"/><text x="36" y="112" font-size="16" fill="#263d3c">A · recommended</text><text x="36" y="141" font-size="14" fill="#263d3c">Use normal list order,</text><text x="36" y="161" font-size="14" fill="#263d3c">selection, and a fixed</text><text x="36" y="181" font-size="14" fill="#263d3c">bottom Play region.</text><rect x="74" y="228" width="128" height="224" rx="5" fill="#e2ebe8" stroke="#78837a"/><rect x="81" y="304" width="114" height="148" rx="8" fill="white" stroke="#78837a"/><rect x="89" y="316" width="98" height="22" rx="3" fill="#f3f6f5" stroke="#78837a"/><rect x="89" y="343" width="98" height="22" rx="3" fill="#f3f6f5" stroke="#78837a"/><rect x="89" y="370" width="98" height="22" rx="3" fill="#f3f6f5" stroke="#78837a"/><rect x="89" y="421" width="98" height="24" rx="4" fill="#246d72" stroke="#78837a"/><text x="122" y="438" font-size="12" fill="white">Play</text><rect x="268" y="85" width="228" height="390" rx="12" fill="white" stroke="#78837a"/><text x="280" y="112" font-size="16" fill="#263d3c">B</text><text x="280" y="141" font-size="14" fill="#263d3c">Keep the current top-</text><text x="280" y="161" font-size="14" fill="#263d3c">rising tray with row-</text><text x="280" y="181" font-size="14" fill="#263d3c">level Play.</text><rect x="318" y="228" width="128" height="224" rx="5" fill="#e2ebe8" stroke="#78837a"/><rect x="325" y="246" width="114" height="180" rx="8" fill="white" stroke="#78837a"/><rect x="333" y="258" width="98" height="22" rx="3" fill="#f3f6f5" stroke="#78837a"/><rect x="333" y="285" width="98" height="22" rx="3" fill="#f3f6f5" stroke="#78837a"/><rect x="333" y="312" width="98" height="22" rx="3" fill="#f3f6f5" stroke="#78837a"/><rect x="333" y="264" width="98" height="24" rx="4" fill="#246d72" stroke="#78837a"/><text x="366" y="281" font-size="12" fill="white">Play</text><rect x="512" y="85" width="228" height="390" rx="12" fill="white" stroke="#78837a"/><text x="524" y="112" font-size="16" fill="#263d3c">C</text><text x="524" y="141" font-size="14" fill="#263d3c">Bottom-anchor the tray</text><text x="524" y="161" font-size="14" fill="#263d3c">but retain row-level</text><text x="524" y="181" font-size="14" fill="#263d3c">Play, accepting higher</text><text x="524" y="201" font-size="14" fill="#263d3c">actions.</text><rect x="562" y="228" width="128" height="224" rx="5" fill="#e2ebe8" stroke="#78837a"/><rect x="569" y="304" width="114" height="148" rx="8" fill="white" stroke="#78837a"/><rect x="577" y="316" width="98" height="22" rx="3" fill="#f3f6f5" stroke="#78837a"/><rect x="577" y="343" width="98" height="22" rx="3" fill="#f3f6f5" stroke="#78837a"/><rect x="577" y="370" width="98" height="22" rx="3" fill="#f3f6f5" stroke="#78837a"/><rect x="577" y="322" width="98" height="24" rx="4" fill="#246d72" stroke="#78837a"/><text x="610" y="339" font-size="12" fill="white">Play</text><rect x="756" y="85" width="228" height="390" rx="12" fill="white" stroke="#78837a"/><text x="768" y="112" font-size="16" fill="#263d3c">D</text><text x="768" y="141" font-size="14" fill="#263d3c">Request another fortune</text><text x="768" y="161" font-size="14" fill="#263d3c">interaction before</text><text x="768" y="181" font-size="14" fill="#263d3c">choosing.</text><rect x="806" y="228" width="128" height="224" rx="5" fill="#e2ebe8" stroke="#78837a"/><rect x="813" y="246" width="114" height="180" rx="8" fill="white" stroke="#78837a"/><rect x="821" y="258" width="98" height="22" rx="3" fill="#f3f6f5" stroke="#78837a"/><rect x="821" y="285" width="98" height="22" rx="