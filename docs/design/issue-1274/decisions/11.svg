xt x="524" y="141" font-size="14" fill="#263d3c">Use 16px on all phone</text><text x="524" y="161" font-size="14" fill="#263d3c">orientations; recompute</text><text x="524" y="181" font-size="14" fill="#263d3c">landscape width.</text><rect x="532" y="255" width="188" height="116" rx="0" fill="#e2ebe8" stroke="#78837a"/><text x="584" y="300" font-size="16" fill="#263d3c">Board</text><rect x="544" y="323" width="164" height="42" rx="6" fill="white" stroke="#78837a"/><text x="597" y="349" font-size="14" fill="#263d3c">Dock</text><text x="524" y="399" font-size="12" fill="#263d3c">See linked geometry study.</text><rect x="756" y="85" width="228" height="390" rx="12" fill="white" stroke="#78837a"/><text x="768" y="112" font-size="16" fill="#263d3c">D</text><text x="768" y="141" font-size="14" fill="#263d3c">Request device and inset</text><text x="768" y="161" font-size="14" fill="#263d3c">comparisons before</text><text x="768" y="181" font-size="14" fill="#263d3c">choosing gutters.</text><rect x="776" y="255" width="188" height="116" rx="0" fill="#e2ebe8" stroke="#78837a"/><text x="828" y="300" font-size="16" fill="#263d3c">Board</text><rect x="788" y="323" width="164" height="42" rx="6" fill="white" stroke="#78837a"/><text x="841" y="349" font-size="14" fill="#263d3c">Dock</text><text x="768" y="399" font-size="12" fill="#263d3c">See linked geometry study.</text></g></svg>