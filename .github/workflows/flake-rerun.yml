# Re-runs a failed CI run's failed jobs once, when every failed job failed in a known flaky test.
# The flakes and their tracking issues are in .github/flaky.json; scripts/flake-rerun.mjs decides.
#
# workflow_run runs in the base repo with a write token, so this never checks out or runs the PR's code.
# It checks out only the default branch's copy of the script and the flake list, and only calls the API.

name: flake-rerun

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: flake-rerun-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.path == '.github/workflows/ci.yml'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/flaky.json
            scripts/flake-rerun.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: node scripts/flake-rerun.mjs
