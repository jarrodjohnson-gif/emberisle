name: Soak

# Nightly 5x soak of the full browser proof lists on main, to catch flakes.
# Also runnable via workflow_dispatch.
on:
  schedule:
    - cron: '17 9 * * *'  # 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  browser-a-soak:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Run browser-a proofs 5x
        id: soak
        run: |
          set -euo pipefail
          PROOFS=(client-prove dpr-prove hotseat-prove tabs-prove countdown-prove trade-prove practice-trade-prove hud-safe-area-prove rotate-overlays-prove fortune-count-prove fortune-tray-prove)
          mkdir -p soak-results
          : > soak-results/failures.txt
          : > soak-results/counts.txt
          declare -A FAILS
          for run in 1 2 3 4 5; do
            for proof in "${PROOFS[@]}"; do
              if ! npm run "$proof" > /tmp/proof.log 2>&1; then
                FAILS["$proof"]=$(( ${FAILS["$proof"]:-0} + 1 ))
                echo "RUN $run $proof FAILED:" >> soak-results/failures.txt
                head -n 20 /tmp/proof.log >> soak-results/failures.txt
                echo "---" >> soak-results/failures.txt
              fi
            done
          done
          for proof in "${!FAILS[@]}"; do
            printf "%s: failed %s/5\n" "$proof" "${FAILS[$proof]}" >> soak-results/counts.txt
          done
          if [ ${#FAILS[@]} -eq 0 ]; then
            echo "no_failures=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_failures=false" >> "$GITHUB_OUTPUT"
            SUMMARY=""
            for proof in "${!FAILS[@]}"; do
              SUMMARY+="$proof: failed ${FAILS[$proof]}/5"$'\n'
            done
            echo "summary<<EOF" >> "$GITHUB_OUTPUT"
            echo "$SUMMARY" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload browser-a soak results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-browser-a
          path: |
            soak-results/
            test-results/
          if-no-files-found: ignore

  browser-b-soak:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        suite: [flows-a, flows-b, presentation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Run browser-b proofs 5x
        id: soak
        run: |
          set -euo pipefail
          if [ "${{ matrix.suite }}" = "flows-a" ]; then
            PROOFS=(hand-cards-prove served-prove chunk-fail-prove restore-prove night-prove chat-prove react-prove wayfarer-prove sounds-prove tokens-prove pieces-prove pieces-land-prove idle-prove contrast-prove keyboard-place-prove upgrade-prove flash-prove reflow-prove rotate-prove)
          elif [ "${{ matrix.suite }}" = "flows-b" ]; then
            PROOFS=(pan-prove hole-prove banner-stable-prove howto-prove title-prove wayfarer-setup-prove victory-target-prove watch-ui-prove tabs-prove-4)
          else
            PROOFS=(visual-direction-prove jelly-ocean-prove waves-prove splash-prove polish-tokens-prove roll-moment-prove goods-log-prove turn-gain-prove win-action-prove turn-copy-prove table-menu-prove build-ready-prove board-look-prove seat-rail-prove public-score-prove hand-hidden-prove install-prove)
          fi
          mkdir -p soak-results
          : > soak-results/failures.txt
          : > soak-results/counts.txt
          declare -A FAILS
          for run in 1 2 3 4 5; do
            for proof in "${PROOFS[@]}"; do
              if ! npm run "$proof" > /tmp/proof.log 2>&1; then
                FAILS["$proof"]=$(( ${FAILS["$proof"]:-0} + 1 ))
                echo "RUN $run $proof FAILED:" >> soak-results/failures.txt
                head -n 20 /tmp/proof.log >> soak-results/failures.txt
                echo "---" >> soak-results/failures.txt
              fi
            done
          done
          for proof in "${!FAILS[@]}"; do
            printf "%s: failed %s/5\n" "$proof" "${FAILS[$proof]}" >> soak-results/counts.txt
          done
          if [ ${#FAILS[@]} -eq 0 ]; then
            echo "no_failures=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_failures=false" >> "$GITHUB_OUTPUT"
            SUMMARY=""
            for proof in "${!FAILS[@]}"; do
              SUMMARY+="$proof: failed ${FAILS[$proof]}/5"$'\n'
            done
            echo "summary<<EOF" >> "$GITHUB_OUTPUT"
            echo "$SUMMARY" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload browser-b soak results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-browser-b-${{ matrix.suite }}
          path: |
            soak-results/
            test-results/
          if-no-files-found: ignore

  report:
    needs: [browser-a-soak, browser-b-soak]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download soak artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: soak-*
          path: soak-artifacts
      - name: Publish consolidated flake report
        uses: actions/github-script@v7
        env:
          SOAK_ARTIFACT_DIR: soak-artifacts
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const root = process.env.SOAK_ARTIFACT_DIR;
            const date = new Date().toISOString().slice(0, 10);
            const title = `Soak: flaky proofs ${date}`;
            const sections = [];
            if (fs.existsSync(root)) {
              for (const job of fs.readdirSync(root).sort()) {
                const dir = path.join(root, job, 'soak-results');
                const counts = path.join(dir, 'counts.txt');
                const failures = path.join(dir, 'failures.txt');
                if (!fs.existsSync(counts)) continue;
                const summary = fs.readFileSync(counts, 'utf8').trim();
                if (!summary) continue;
                const snippets = fs.existsSync(failures) ? fs.readFileSync(failures, 'utf8').trim() : '';
                sections.push(`### ${job}\n\n${summary}\n\n<details><summary>Failure excerpts (run, proof, first 20 lines)</summary>\n\n\`\`\`text\n${snippets.slice(0, 45000)}\n\`\`\`\n</details>`);
              }
            }
            if (!sections.length) {
              core.info('No recorded proof failures to report.');
              return;
            }
            const body = `Nightly 5x soak on main found failing proofs. [Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).\n\n${sections.join('\n\n')}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number, body
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body,
                labels: ['test', 'status:todo', 'lane:net']
              });
            }
