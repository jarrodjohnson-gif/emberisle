# Lets approved users set labels by commenting on an issue or PR.
# Nobody needs write access: the workflow applies the label for them.
#
#   /todo  /backlog  /claim  /in-progress  /in-review
#   /paused  /done  /failed  /canceled      -> swaps the status:* label
#                                              (/done and /canceled: repo owner only)
#   /changed   /unchanged                   -> adds / removes mark:changed
#   /label <name>   /unlabel <name>         -> any existing status:, mark:, lane:, model: label
#                                              (repo owner only; helpers use the status commands)
#
# Several commands can go in one comment, one per line.
# The bot reacts 👍 when it applied the labels, 👎 when it refused.

name: label-commands

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: label-commands-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  label:
    if: contains(github.event.comment.body, '/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Who may use the commands. Add GitHub usernames here.
            const ALLOWED_USERS = ['jarrodjohnson-gif', 'joshspicy2'];

            const STATUS = {
              '/todo': 'status:todo',
              '/backlog': 'status:backlog',
              '/claim': 'status:claimed',
              '/claimed': 'status:claimed',
              '/in-progress': 'status:in-progress',
              '/in-review': 'status:in-review',
              '/paused': 'status:paused',
              '/done': 'status:done',
              '/failed': 'status:failed',
              '/canceled': 'status:canceled',
            };
            const PREFIXES = ['status:', 'mark:', 'lane:', 'model:'];
            // Sign-off labels: only the repo owner can set or remove these.
            const OWNER_ONLY = ['status:done', 'status:canceled'];

            // The comment is read from the event payload as data.
            // It is never interpolated into this script or a shell.
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const comment_id = context.payload.comment.id;
            const actor = context.payload.comment.user.login;
            const isOwner = actor === owner;
            const react = (content) =>
              github.rest.reactions.createForIssueComment({ owner, repo, comment_id, content });

            const lines = context.payload.comment.body
              .split('\n').map(s => s.trim()).filter(s => s.startsWith('/'));
            if (!lines.length) return;
            const KNOWN = [...Object.keys(STATUS), '/changed', '/unchanged', '/label', '/unlabel'];
            if (!lines.some(l => KNOWN.includes(l.split(/\s+/)[0].toLowerCase()))) return;

            // Refuse everyone not on the list before doing anything else.
            if (!ALLOWED_USERS.includes(actor)) {
              core.notice(`${actor} is not in ALLOWED_USERS`);
              await react('-1');
              return;
            }

            // Reconstruct ownership from trusted comments, never from reaction approval or run order.
            const allComments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 });
            const liveIssue = (await github.rest.issues.get({ owner, repo, issue_number })).data;
            const timeline = await github.paginate(github.rest.issues.listEventsForTimeline,
              { owner, repo, issue_number, per_page: 100 });
            const commandLines = body => (body || '').split('\n').map(s => s.trim()).filter(s => s.startsWith('/'));
            const agentLine = (body, kind) => {
              // The date is the delimiter: agent names themselves can contain commas.
              const match = (body || '').match(new RegExp(`^${kind}:\\s*(.+),\\s*\\d{4}-\\d{2}-\\d{2}\\s*$`, 'im'));
              return match && match[1].trim();
            };
            const trusted = c => ALLOWED_USERS.includes(c.user?.login);
            const ordered = allComments.filter(trusted).sort((a, b) =>
              Date.parse(a.created_at) - Date.parse(b.created_at) || a.id - b.id);
            const prCache = new Map();
            const linkedPR = async number => {
              if (!prCache.has(number)) {
                try {
                  const pr = (await github.rest.pulls.get({ owner, repo, pull_number: number })).data;
                  // An explicit pr: line and a reciprocal issue reference bind the reservation.
                  // Another PR's closure must never release this issue's claimant.
                  const localReference = new RegExp(`(^|[^A-Za-z0-9_])#${issue_number}(?![0-9])`);
                  const fullReference = new RegExp(`https://github\\.com/${owner}/${repo}/issues/${issue_number}(?![0-9])`, 'i');
                  if (localReference.test(pr.body || '') || fullReference.test(pr.body || '')) {
                    const history = await github.paginate(github.rest.issues.listEventsForTimeline,
                      { owner, repo, issue_number: number, per_page: 100 });
                    // Reopening a PR must not erase its earlier release event.
                    pr.claimClosedAt = [...new Set([
                      ...history.filter(e => e.event === 'closed' || e.event === 'merged').map(e => e.created_at),
                      ...(pr.closed_at ? [pr.closed_at] : []),
                    ])];
                    prCache.set(number, pr);
                  } else prCache.set(number, null);
                } catch (error) {
                  if (error.status !== 404) throw error;
                  prCache.set(number, null);
                }
              }
              return prCache.get(number);
            };
            const events = ordered.map(c => ({ at: c.created_at, id: c.id, comment: c }));
            for (const event of timeline) {
              if (event.event === 'closed' || event.event === 'reopened') {
                events.push({ at: event.created_at, id: event.id, event: event.event });
              }
            }
            // PR closure events enter the replay at closure time, even if their workflow ran later.
            // Associate them when the pr: comment is encountered, rather than releasing from current state.
            for (const c of ordered) {
              for (const match of (c.body || '').matchAll(/^pr:\s*#(\d+)\s*$/gim)) {
                const pr = await linkedPR(Number(match[1]));
                if (pr && pr.user?.login === c.user.login) {
                  for (const closedAt of pr.claimClosedAt) {
                    if (Date.parse(closedAt) >= Date.parse(c.created_at)) {
                      events.push({ at: closedAt, id: Number.MAX_SAFE_INTEGER,
                        event: 'pr-closed', number: pr.number });
                    }
                  }
                }
              }
            }
            events.sort((a, b) => Date.parse(a.at) - Date.parse(b.at) || a.id - b.id);
            let active = null;
            let replayStatus;
            let issueClosed = false;
            const accepted = new Set();
            const refusals = new Map();
            const applyReplayStatus = (label, actorLogin) => {
              // Preserve owner-only addition AND removal of sign-off labels during replay.
              if (actorLogin !== owner && (OWNER_ONLY.includes(label) || OWNER_ONLY.includes(replayStatus))) return;
              replayStatus = label;
            };
            for (const item of events) {
              if (item.event) {
                if (item.event === 'closed') { active = null; issueClosed = true; }
                if (item.event === 'reopened') issueClosed = false;
                if (item.event === 'pr-closed' && active?.prs.has(item.number)) active = null;
                continue;
              }
              const c = item.comment;
              const cLines = commandLines(c.body);
              const name = agentLine(c.body, 'claimed');
              const pauseName = agentLine(c.body, 'paused');
              const isClaim = cLines.some(l => ['/claim', '/claimed'].includes(l.split(/\s+/)[0].toLowerCase()));
              let deniedClaim = false;
              if (isClaim) {
                if (active) {
                  refusals.set(c.id, active.comment);
                  deniedClaim = true;
                } else if (name && !issueClosed) {
                  active = { name, comment: c, prs: new Set() };
                  accepted.add(c.id);
                } else {
                  // Identity is required to distinguish agents sharing one account.
                  refusals.set(c.id, null);
                  deniedClaim = true;
                }
              }
              // A historical plain paused: line also releases only its own agent.
              const foreignAgent = active && ((name && name !== active.name) || (pauseName && pauseName !== active.name));
              const hadActive = !!active;
              const ownPause = pauseName && active?.name === pauseName;
              if (ownPause) active = null;
              for (const line of cLines) {
                const [raw, ...args] = line.split(/\s+/);
                const cmd = raw.toLowerCase();
                if (STATUS[cmd]) {
                  if (deniedClaim || foreignAgent) continue;
                  if (cmd === '/paused' && hadActive && !ownPause) continue;
                  applyReplayStatus(STATUS[cmd], c.user.login);
                } else if (!deniedClaim && !foreignAgent && c.user.login === owner && (cmd === '/label' || cmd === '/unlabel')) {
                  // Canonicalize status labels just as the normal command path does.
                  const arg = args.join(' ').trim();
                  if (!arg.toLowerCase().startsWith('status:')) continue;
                  let canonical;
                  try { canonical = (await github.rest.issues.getLabel({ owner, repo, name: arg })).data.name; }
                  catch (error) { if (error.status === 404) continue; throw error; }
                  if (!canonical.startsWith('status:')) continue;
                  if (cmd === '/label') replayStatus = canonical;
                  else if (replayStatus === canonical) replayStatus = null;
                }
              }
              if (active && c.user.login === active.comment.user.login && !deniedClaim && (!name || name === active.name) && (!pauseName || pauseName === active.name)) {
                for (const match of (c.body || '').matchAll(/^pr:\s*#(\d+)\s*$/gim)) {
                  const pr = await linkedPR(Number(match[1]));
                  if (pr && pr.user?.login === c.user.login) active.prs.add(pr.number);
                }
              }
            }
            const isBot = user => user?.login === 'github-actions[bot]' && user?.type === 'Bot';
            const reconcileReaction = async (id, content) => {
              const reactions = await github.paginate(github.rest.reactions.listForIssueComment,
                { owner, repo, comment_id: id, per_page: 100 });
              const opposite = content === '+1' ? '-1' : '+1';
              for (const reaction of reactions) {
                if (isBot(reaction.user) && reaction.content === opposite) {
                  await github.rest.reactions.deleteForIssueComment({ owner, repo, comment_id: id, reaction_id: reaction.id });
                }
              }
              if (!reactions.some(r => isBot(r.user) && r.content === content)) {
                await github.rest.reactions.createForIssueComment({ owner, repo, comment_id: id, content });
              }
            };
            // Repair all claim reactions, including a cancelled winner run or stale loser approval.
            for (const id of accepted) await reconcileReaction(id, '+1');
            for (const id of refusals.keys()) await reconcileReaction(id, '-1');
            const refused = refusals.has(comment_id);
            if (refused) {
              const winner = refusals.get(comment_id);
              const marker = `<!-- claim-refusal:${comment_id} -->`;
              if (!allComments.some(c => isBot(c.user) && (c.body || '').includes(marker))) {
                const message = winner
                  ? `Already claimed by ${agentLine(winner.body, 'claimed')} at ${winner.created_at}. Pick another issue.`
                  : 'A claim needs a claimed: <agent name>, <YYYY-MM-DD> line on an open issue.';
                await github.rest.issues.createComment({ owner, repo, issue_number, body: `${message}\n\n${marker}` });
              }
            }

            const current = liveIssue.labels.map(l => l.name);
            const want = new Set(current);
            let matched = false;
            const bad = [];

            const setStatus = (label) => {
              for (const l of [...want]) if (l.startsWith('status:')) want.delete(l);
              want.add(label);
            };

            for (const line of lines) {
              const [rawCmd, ...rest] = line.split(/\s+/);
              const cmd = rawCmd.toLowerCase();
              const arg = rest.join(' ').trim();

              if (STATUS[cmd]) { setStatus(STATUS[cmd]); matched = true; }
              else if (cmd === '/changed') { want.add('mark:changed'); matched = true; }
              else if (cmd === '/unchanged') { want.delete('mark:changed'); matched = true; }
              else if (cmd === '/label' || cmd === '/unlabel') {
                matched = true;
                // Free-form labels are the owner's; helpers only get the fixed status commands above.
                if (!isOwner) { bad.push(`${cmd} (owner only)`); continue; }
                // Use the label's canonical name from GitHub, so a case variant can't slip past the checks below.
                let name;
                try { name = (await github.rest.issues.getLabel({ owner, repo, name: arg })).data.name; }
                catch { bad.push(arg || '(blank)'); continue; }
                if (!PREFIXES.some(p => name.startsWith(p))) { bad.push(name); continue; }
                if (cmd === '/unlabel') want.delete(name);
                else if (name.startsWith('status:')) setStatus(name);
                else want.add(name);
              }
            }

            if (!matched) return;

            // Report a refused sign-off operation even if replay already preserved its label.
            if (!isOwner) {
              const blocked = OWNER_ONLY.filter(l => want.has(l) !== current.includes(l));
              bad.push(...blocked.map(l => `${l} (owner only)`));
            }
            // Reconcile chronological status even when this run handles an older comment.
            if (replayStatus !== undefined) {
              for (const l of [...want]) if (l.startsWith('status:')) want.delete(l);
              if (replayStatus) want.add(replayStatus);
            }
            if (refused) bad.push('claim refused');

            // Keep the original live-label sign-off boundary, including labels set outside this bot.
            if (!isOwner) {
              const blocked = OWNER_ONLY.filter(l => want.has(l) !== current.includes(l));
              if (blocked.length) {
                bad.push(...blocked.map(l => `${l} (owner only)`));
                for (const l of [...want]) if (l.startsWith('status:')) want.delete(l);
                for (const l of current) if (l.startsWith('status:')) want.add(l);
              }
            }

            for (const l of current) {
              if (!want.has(l)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: l });
              }
            }
            const toAdd = [...want].filter(l => !current.includes(l));
            if (toAdd.length) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: toAdd });
            }

            if (bad.length) {
              core.warning(`Unknown or not allowed: ${bad.join(', ')}`);
              await reconcileReaction(comment_id, '-1');
            } else {
              if (!refused) await reconcileReaction(comment_id, '+1');
            }
