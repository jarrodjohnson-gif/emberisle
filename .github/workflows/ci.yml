name: CI

# The README "Run it" checks, on every pull request and every push to main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run client-prove
      - run: npm run hotseat-prove
      - run: npm run tabs-prove
      - run: npm run trade-prove
      - run: npm run served-prove
      - run: npm run chat-prove
      - run: npm run wayfarer-prove
      - run: npm run tokens-prove
      - run: npm run pieces-prove
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-prove-screenshot
          path: test-results/
          if-no-files-found: ignore
