# Auto-merges docs-only PRs (#923, phase 1). scripts/auto-merge-eligible.mjs decides; the rules are in its header.
# A PR merges only when every changed file is an allowed doc, `checks` is green on the exact head SHA, and the desk
# has posted <!-- review-desk: clean <40-char head SHA> -->. The merge pins that SHA with --match-head-commit.
#
# Kill switch: the repo variable AUTO_MERGE. Unset or anything but "on" means this never runs.
# Rollback: git revert the merge, then set AUTO_MERGE=off.
#
# pull_request_target, workflow_run and issue_comment run in the base repo with a write token, so this never checks out
# or runs the PR's code. It checks out only the default branch's copy of the script, and only calls the API.

name: auto-merge

on:
  pull_request_target:
    types: [synchronize, ready_for_review]
  workflow_run:
    workflows: [CI]
    types: [completed]
  # The desk's clean marker can land after CI goes green, so it triggers a check too.
  issue_comment:
    types: [created]

# The built-in token only reads. The merge and the label use the app token in the app-token step.
permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      vars.AUTO_MERGE == 'on' && (
        github.event_name == 'pull_request_target' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.path == '.github/workflows/ci.yml') ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
          contains(github.event.comment.body, '<!-- review-desk: clean'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/auto-merge-eligible.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/auto-merge-eligible.mjs
      # The ruleset restricts updates to main, so the built-in token cannot merge. A dedicated app, on the ruleset's bypass list,
      # does. Only this step holds its token, limited to the two permissions a squash merge and a label need.
      - id: app-token
        if: steps.decide.outputs.merge == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - if: steps.decide.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ steps.decide.outputs.number }}
          SHA: ${{ steps.decide.outputs.sha }}
        run: |
          gh pr merge "$NUM" --repo "$REPO" --squash --match-head-commit "$SHA"
          gh api -X POST "repos/$REPO/issues/$NUM/labels" -f 'labels[]=auto-merged'
