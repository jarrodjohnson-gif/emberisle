><rect x="756" y="85" width="228" height="390" rx="12" fill="white" stroke="#78837a"/><text x="768" y="112" font-size="16" fill="#263d3c">D</text><text x="768" y="141" font-size="14" fill="#263d3c">Keep current identity</text><text x="768" y="161" font-size="14" fill="#263d3c">pending a broader</text><text x="768" y="181" font-size="14" fill="#263d3c">accessibility study.</text><circle cx="826" cy="295" r="18" fill="#eadbb2" stroke="#78837a" stroke-width="1"/><text x="857" y="301" font-size="16" fill="#263d3c">Dune</text></g></svg>