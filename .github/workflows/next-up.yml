name: Next up

on:
  schedule:
    - cron: '*/15 * * * *'
  issues:
    types: [opened, closed, reopened, labeled, unlabeled, edited, milestoned, demilestoned]
  pull_request_target:
    types: [opened, closed, reopened, edited, labeled, unlabeled, ready_for_review, converted_to_draft]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read
  contents: read

concurrency:
  group: next-up
  cancel-in-progress: false

jobs:
  update:
    # Avoid responding to our own generated body update. Run trusted default-branch code only.
    if: >-
      !(github.event_name == 'issues' && github.event.action == 'edited' &&
        contains(github.event.issue.labels.*.name, 'next-up')) &&
      (github.event_name != 'issue_comment' ||
        contains(github.event.comment.body, 'claimed:') ||
        contains(github.event.comment.body, 'paused:') ||
        contains(github.event.comment.body, 'pr:'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/next-up.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
