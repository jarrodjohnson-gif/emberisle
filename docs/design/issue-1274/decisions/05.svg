<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510"><rect width="1000" height="510" fill="#f3f6f5"/><g font-family="Arial, sans-serif"><text x="24" y="35" font-size="24" fill="#263d3c">05 · Hand names — schematic alternatives</text><text x="24" y="61" font-size="14" fill="#263d3c">Proposed only · not a runtime screenshot · A is recommended</text><rect x="24" y="85" width="228" height="390" rx="12" fill="white" stroke="#78837a"/><text x="36" y="112" font-size="16" fill="#263d3c">A · recommended</text><text x="36" y="141" font-size="14" fill="#263d3c">Keep V1 names at 10px</text><text x="36" y="161" font-size="14" fill="#263d3c">uppercase.</text><rect x="89" y="255" width="98" height="100" rx="8" fill="white" stroke="#78837a"/><text x="125" y="297" font-size="28" fill="#263d3c">3</text><text x="100" y="329" font-size="10" fill="#263d3c">TIMBER</text><rect x="268" y="85" width="228" height="390" rx="12" fill="white" stroke="#78837a"/><text x="280" y="112" font-size="16" fill="#263d3c">B</text><text x="280" y="141" font-size="14" fill="#263d3c">Use 12px sentence-case</text><text x="280" y="161" font-size="14" fill="#263d3c">names after a narrow-card</text><text x="280" y="181" font-size="14" fill="#263d3c">mock.</text><rect x="333" y="255" width="98" height="100" rx="8" fill="white" stroke="#78837a"/><text x="369" y="297" font-size="28" fill="#263d3c">3</text><text x="344" y="329" font-size="12" fill="#263d3c">Timber</text><rect x="512" y="85" width="228" height="390" rx="12" fill="white" stroke="#78837a"/><text x="524" y="112" font-size="16" fill="#263d3c">C</text><text x="524" y="141" font-size="14" fill="#263d3c">Use 12px uppercase names</text><text x="524" y="161" font-size="14" fill="#263d3c">after a narrow-card mock.</text><rect x="577" y="255" width="98" height="100" rx="8" fill="white" stroke="#78837a"/><text x="613" y="297" font-size="28" fill="#263d3c">3</text><text x="588" y="329" font-size="12" fill="#263d3c">TIMBER</text><rect x="756" y="85" width="228" height="390" rx="12" fill="white" stroke="#78837a"/><text x="768" y="112" font-size="16" fill="#263d3c">D</text><text x="768" y="141" font-size="14" fill="#263d3c">Resolve names through the</text><text x="768" y="161" font-size="14" fill="#263d3c">active hand-design work</text><text x="768" y="181" font-size="14" fill="#263d3c">first.</text><rect x="821" y="255" width="98" height="100" rx="8" fill="white" stroke="#78837a"/><text x="857" y="297" font-size="28" fill="#263d3c">3</text><text x="832" y="329" font-size="12" fill="#263d3c">V1 review</text></g></svg>